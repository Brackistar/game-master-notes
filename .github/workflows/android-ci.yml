name: Android CI

on:
  push:
    paths:
      - "android/**"
      - "pack-builder/**"
      - "pack-builder/tests/fixtures/v1/synthetic.gmnpack"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "pack-builder/**"
      - "pack-builder/tests/fixtures/v1/synthetic.gmnpack"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Android Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode=fail
