<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Wayfinder Ask recovery states</title><desc id="d">No books, no evidence, timeout, model missing, and generic error patterns.</desc><style>text{font-family:Roboto,Arial;fill:#142C3A}.h{font-size:24px;font-weight:700}.s{font-size:14px}.m{font-size:12px;fill:#637788}.bg{fill:#F3F6F8}.card{fill:#fff;stroke:#C9D5DC}.warn{fill:#FFF2CC;stroke:#815500}.err{fill:#FDE8E7;stroke:#B42318}.btn{fill:#087EA4}.bt{fill:#fff;font-weight:700}</style><rect width="1440" height="900" class="bg"/><text x="36" y="42" class="h">04 · Ask — recovery system</text><g transform="translate(36 72)"><rect width="1348" height="770" rx="18" class="card"/><text x="30" y="46" class="m">SAME COMPONENT CONTRACT · REFLOW CARDS TO ONE COLUMN ON PHONE</text><g transform="translate(30 76)"><rect width="400" height="280" rx="12" class="warn"/><text x="24" y="44" class="h">No sourcebooks yet</text><text x="24" y="78" class="s">Add sourcebooks before asking.</text><text x="24" y="108" class="m">Your draft remains safe on this device.</text><rect x="24" y="142" width="152" height="48" rx="8" class="btn"/><text x="44" y="172" class="bt s">Add sourcebooks</text><text x="24" y="226" class="s">How imports work →</text></g><g transform="translate(458 76)"><rect width="400" height="280" rx="12" class="card"/><text x="24" y="44" class="h">Not enough evidence</text><text x="24" y="78" class="s">I couldn't find enough support in this scope.</text><text x="24" y="108" class="m">Try a rule, place, character, or exact book term.</text><rect x="24" y="142" width="132" height="48" rx="8" class="btn"/><text x="48" y="172" class="bt s">Edit question</text><text x="180" y="172" class="s">Change scope</text></g><g transform="translate(886 76)"><rect width="400" height="280" rx="12" class="err"/><text x="24" y="44" class="h">Time limit reached</text><text x="24" y="78" class="s">The local model reached its time limit.</text><text x="24" y="108" class="m">Your question and cited excerpts remain safe.</text><rect x="24" y="142" width="190" height="48" rx="8" class="btn"/><text x="42" y="172" class="bt s">Try narrower question</text><text x="24" y="226" class="s">Use grounded excerpts →</text></g><g transform="translate(30 388)"><rect width="610" height="250" rx="12" class="warn"/><text x="24" y="44" class="h">Local model needed</text><text x="24" y="80" class="s">Grounded excerpts still work without a GGUF model.</text><rect x="24" y="120" width="158" height="48" rx="8" class="btn"/><text x="45" y="150" class="bt s">Set up local model</text><text x="210" y="150" class="s">Use excerpts only</text></g><g transform="translate(666 388)"><rect width="620" height="250" rx="12" class="err"/><text x="24" y="44" class="h">Answer could not be completed</text><text x="24" y="80" class="s">Nothing was removed. The question is ready to retry.</text><rect x="24" y="120" width="108" height="48" rx="8" class="btn"/><text x="52" y="150" class="bt s">Retry</text><text x="160" y="150" class="s">View diagnostics</text></g></g></svg>
