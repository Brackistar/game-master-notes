<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Wayfinder future Session concept</title><desc id="d">Clearly marked future session workspace and the production planned-state alternative.</desc><style>text{font-family:Roboto,Arial;fill:#142C3A}.h{font:700 25px Roboto}.s{font:14px Roboto}.m{font:12px Roboto;fill:#637788}.bg{fill:#F3F6F8}.card{fill:#fff;stroke:#C9D5DC}.nav{fill:#102333}.future{fill:#EEF3F6;stroke:#637788;stroke-dasharray:6 5}.sel{fill:#D7F5FF}</style><rect width="1440" height="900" class="bg"/><text x="36" y="42" class="h">07 · Session — future concept, not v1 commitment</text><g transform="translate(36 72)"><rect width="900" height="770" rx="18" class="card"/><rect width="190" height="770" rx="18" class="nav"/><text x="22" y="44" style="fill:#E2ECF2;font:700 22px Roboto">Wayfinder</text><text x="24" y="102" style="fill:#E2ECF2;font:14px Roboto">✦ Ask</text><text x="24" y="150" style="fill:#E2ECF2;font:14px Roboto">▤ Library</text><rect x="14" y="174" width="162" height="48" rx="8" class="sel"/><text x="28" y="204" class="s">◇ Session · future</text><text x="218" y="46" class="m">SESSION / THE OBSIDIAN GATE</text><text x="218" y="86" class="h">Tonight's session</text><rect x="218" y="116" width="408" height="170" rx="12" class="future"/><text x="242" y="154" class="h">Quick Ask</text><text x="242" y="194" class="s">Ask within the active session context…</text><text x="242" y="250" class="m">Requires approved session-scope contract</text><rect x="646" y="116" width="226" height="270" rx="12" class="future"/><text x="668" y="154" class="h">Pinned evidence</text><text x="668" y="194" class="m">No persistence contract yet</text><rect x="218" y="310" width="408" height="260" rx="12" class="future"/><text x="242" y="350" class="h">GM notes</text><text x="242" y="390" class="m">Future editable session notes</text><text x="218" y="700" class="s">Production v1: hide Session, or show one honest “Planned” page with no fake controls.</text></g><g transform="translate(982 72)"><rect width="400" height="770" rx="30" class="card"/><text x="24" y="50" class="m">SESSION</text><text x="24" y="90" class="h">Session is planned</text><text x="24" y="132" class="s">A focused workspace for questions, pinned</text><text x="24" y="156" class="s">evidence, and GM notes will come later.</text><rect x="20" y="202" width="360" height="110" rx="12" class="future"/><text x="42" y="244" class="s">No controls appear until data and</text><text x="42" y="270" class="s">persistence behavior are implemented.</text></g></svg>
