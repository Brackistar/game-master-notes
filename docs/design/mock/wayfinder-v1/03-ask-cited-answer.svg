ass="link">1 · p. 142</text><text x="690" y="210" class="s">Bestiary of Cinders</text><text x="690" y="242" class="m">“Three stones…”</text><text x="690" y="304" class="link">Open excerpt →</text><rect x="676" y="348" width="180" height="178" rx="10" fill="#EEF3F6"/><text x="690" y="376" class="link">2 · p. 38</text><text x="690" y="404" class="s">Ashen Court</text><text x="690" y="436" class="m">“Speak the oath…”</text></g><g transform="translate(982 72)"><rect width="400" height="770" rx="30" class="card"/><text x="24" y="48" class="m">ASK / ANSWER</text><rect x="20" y="72" width="142" height="34" rx="17" class="good"/><text x="34" y="94" class="s">✓ Supported answer</text><text x="24" y="146" class="h">The gate opens at moonrise</text><text x="24" y="184" class="s">Align the three marked stones [1], then</text><text x="24" y="208" class="s">speak the warden's oath [2].</text><rect x="20" y="246" width="360" height="56" rx="8" fill="#D7F5FF"/><text x="40" y="280" class="link">▤ 2 cited sources →</text><text x="24" y="650" class="m">Compact: Evidence opens full screen; Back preserves scroll.</text><rect y="708" width="400" height="62" class="nav"/></g></svg>
